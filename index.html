<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Roblox Clone</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Gotham+SSm:wght@300;400;500;700&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
      body {
        font-family: 'Inter', sans-serif;
        background-color: #232527; /* Roblox Dark Theme Background */
        color: white;
        overflow-x: hidden;
      }
      /* Custom Scrollbar */
      ::-webkit-scrollbar {
        width: 8px;
        height: 8px;
      }
      ::-webkit-scrollbar-track {
        background: #232527;
      }
      ::-webkit-scrollbar-thumb {
        background: #565656;
        border-radius: 4px;
      }
      ::-webkit-scrollbar-thumb:hover {
        background: #787878;
      }
    </style>
  <script type="importmap">
{
  "imports": {
    "react-dom/": "https://esm.sh/react-dom@^19.2.4/",
    "lucide-react": "https://esm.sh/lucide-react@^0.563.0",
    "react/": "https://esm.sh/react@^19.2.4/",
    "react": "https://esm.sh/react@^19.2.4",
    "three": "https://esm.sh/three@^0.182.0",
    "@react-three/drei": "https://esm.sh/@react-three/drei@^10.7.7",
    "react-router-dom": "https://esm.sh/react-router-dom@^7.13.0",
    "@react-three/fiber": "https://esm.sh/@react-three/fiber@^9.5.0",
    "three/": "https://esm.sh/three@^0.182.0/"
  }
}
</script>
<link rel="stylesheet" href="/index.css">
</head>
  <body>
    <div id="root">
      <div style="height: 100vh; width: 100vw; display: flex; flex-direction: column; align-items: center; justify-content: center; background-color: #232527; color: white; font-family: sans-serif;">
        <div style="width: 80px; height: 80px; background-color: white; border-radius: 12px; transform: rotate(12deg); border: 8px solid #232527; outline: 4px solid white; display: flex; align-items: center; justify-content: center; margin-bottom: 24px;">
          <div style="width: 20px; height: 20px; background-color: #232527;"></div>
        </div>
        <h1 style="font-size: 24px; font-weight: bold; margin-bottom: 8px;">ROBLOX</h1>
        <div style="width: 200px; height: 4px; background-color: #393b3d; border-radius: 2px; overflow: hidden;">
          <div style="width: 30%; height: 100%; background-color: #00b06f; animation: loading 2s infinite ease-in-out;"></div>
        </div>
        <p style="margin-top: 16px; color: #a3a2a5; font-size: 14px;">Cargando experiencias...</p>
      </div>
    </div>
    <style>
      @keyframes loading {
        0% { transform: translateX(-100%); }
        100% { transform: translateX(400%); }
      }
    </style>
  <script type="module" src="/index.tsx"></script>
</body>
</html>
